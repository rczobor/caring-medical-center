  faq:
    title: Frequently asked questions
    items:
      - question: How long does the one-day process take?
        answer: The MoveWell diagnostic and rehabilitation process usually runs between 08:00 and 17:00, depending on the type of exam and how busy the clinic is.
      - question: Do I need a referral for the exam?
        # FLAGGED G5.
        answer: No, you don't need a referral. You can book our MRI and other diagnostic exams directly.
      - question: What should I do if I get injured on the weekend?
        answer: Our on-call MRI diagnostic service is also available on weekends, so you can get a fast, accurate exam even in urgent cases.
      - question: Insurance and payment options?
        answer: |-
          At Medical Point, you can pay for exams and treatments through several Hungarian health funds, so you can choose the payment method that suits you best.

          Our health fund partners:

          - Prémium Egészség- és Önsegélyező Pénztár
          - OTP Egészség- és Önsegélyező Pénztár
          - Allianz Egészség- és Önsegélyező Pénztár
          - Medicina Egészségpénztár
          - Patika Egészségpénztár
          - Generali Egészség- és Önsegélyező Pénztár
          - Vitamin Egészség- és Önsegélyező Pénztár
          - Vasutas Egészségpénztár

          If you are not sure whether your health fund is one of our partners, our staff will be happy to help with the details.
      - question: Are there any contraindications for an MRI scan?
        answer: Before an MRI scan, it is important to tell the staff if you have any metal device in your body (for example a pacemaker, an aneurysm clip, a drug delivery device or an implant). During pregnancy, an MRI can only be done on a specialist's recommendation. In some cases, a contrast agent may also be needed; if you have had any side effects before, please tell our staff. Our facility always has the right medical support in place to safely manage any allergic reaction.
