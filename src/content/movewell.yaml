    title: Gyakran Ismételt Kérdések
    items:
      - question: Mennyi ideig tart az egynapos folyamat?
        answer: A MoveWell diagnosztikai és rehabilitációs folyamat általában 08:00 és 17:00 óra között zajlik, a vizsgálat típusától és a betegforgalomtól függően.
      - question: Kell-e beutaló a vizsgálathoz?
        # FLAGGED G5.
        answer: Nem, beutaló nem szükséges. Pácienseink közvetlenül is bejelentkezhetnek MRI- vagy egyéb diagnosztikai vizsgálatainkra.
      - question: Mi a teendő, ha hétvégén sérülök meg?
        answer: MRI diagnosztikai ügyeletünk hétvégén is elérhető, így sürgős esetben is biztosított a gyors és pontos vizsgálat.
      - question: Biztosító/finanszírozás opciók?
        answer: |-
          A Medical Pointnál a vizsgálatok és kezelések díját több egészségpénztáron keresztül is rendezheti, így pácienseink rugalmasan választhatják meg a számukra legkényelmesebb finanszírozási módot.

          Egészségpénztári partnereink:

          - Prémium Egészség- és Önsegélyező Pénztár
          - OTP Egészség- és Önsegélyező Pénztár
          - Allianz Egészség- és Önsegélyező Pénztár
          - Medicina Egészségpénztár
          - Patika Egészségpénztár
          - Generali Egészség- és Önsegélyező Pénztár
          - Vitamin Egészség- és Önsegélyező Pénztár
          - Vasutas Egészségpénztár

          Amennyiben nem biztos benne, hogy az Ön egészségpénztára szerepel partnereink között, munkatársaink készséggel segítenek a részletekben.
      - question: Vannak-e ellenjavallatok az MRI-vizsgálathoz?
        # "szakszemélyzetet,ha": the live text's missing space, kept verbatim.
        answer: Az MRI-vizsgálat előtt fontos, hogy tájékoztassa a szakszemélyzetet,ha a szervezetében bármilyen fémes eszköz található (például pacemaker, aneurysmaclip, gyógyszeradagoló készülék vagy implantátum). Terhesség esetén az MRI csak szakorvosi javaslatra végezhető el. Bizonyos esetekben kontrasztanyag adása is szükségessé válhat, ha korábban bármilyen mellékhatást tapasztalt, kérjük, jelezze a kollégáknak. Intézményünkben minden esetben biztosított a megfelelő orvosi háttér az esetleges allergiás reakciók biztonságos kezeléséhez.
