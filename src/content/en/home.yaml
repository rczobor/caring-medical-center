diagnosticsTitle: Diagnostics
diagnostics:
  - title: MRI scans
    text: Most patients come for an MRI scan on a specialist's recommendation, but with us the exam can be requested without a referral, even on weekends. Do you have a question? Feel free to contact us.
    page: /en/mri
    prices: mr
  - title: CT scans
    text: CT scans at Caring Medical Buda, with online booking.
    page: /en/ct
    prices: ct
  - title: X-ray exams
    text: The digital X-ray equipment used at Caring Medical Center is a patient-friendly device built on the latest technology, and it puts less strain on your body.
    page: /en/x-ray
    prices: rtg
  - title: Laboratory tests
    text: Lab tests help map exactly how your body is working, whether for a routine check-up or targeted diagnostics. With us, the most common blood, urine and hormone tests can be done quickly and conveniently, even without a referral. Have a question? Feel free to contact us!
    page: /en/laboratory-tests
  - title: Ultrasound
    text: Ultrasound is a painless, fast and accurate way to examine your internal organs, joints and blood vessels. With our modern equipment you get an immediate picture of your health, even without a referral. Contact us for an appointment!
    page: /en/ultrasound
aboutTitle: Rehabilitation, diagnostic and medical center
aboutText: Our goal is accurate diagnosis and targeted treatment of musculoskeletal conditions for amateur and professional athletes and for private individuals. Using modern examination methods, we uncover the causes of musculoskeletal complaints and analyze load capacity and injury risk. Building on the diagnostic results, we put together personalized physiotherapy and physical therapy programs that support effective recovery, pain relief and the restoration of movement. With our integrated approach, we not only support healing but also contribute to prevention.
