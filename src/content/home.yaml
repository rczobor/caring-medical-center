diagnosticsTitle: Diagnosztika
diagnostics:
  - title: MRI vizsgálatok
    text: Többnyire a betegek szakorvosi javaslatra érkeznek MRI vizsgálatra, azonban nálunk beutaló nélkül, akár hétvégén is indikálható a vizsgálat. Kérdése merült fel? Forduljon hozzánk bizalommal.
    page: /mrvizsgalat
    prices: mr
  # new: FLAGGED H11
  - title: CT vizsgálatok
    text: CT-vizsgálat a Caring Medical Budában, online időpontfoglalással.
    page: /ct-vizsgalatok
    prices: ct
  - title: Röntgenvizsgálatok
    text: A Caring Medical Centerben használt digitális röntgenberendezés már a legújabb technológiának megfelelő páciensbarát eszköz, amely kevesebb terheléssel jár a szervezet számára.
    page: /rontgenvizsgalat
    prices: rtg
  - title: Laborvizsgálatok
    text: A laborvizsgálatok segítenek a szervezet működésének pontos feltérképezésében, legyen szó rutinvizsgálatról vagy célzott diagnosztikáról. Nálunk gyorsan, kényelmesen és előzetes beutaló nélkül is elvégeztethetők a leggyakoribb vér-, vizelet- és hormonvizsgálatok. Kérdése van? Forduljon hozzánk bizalommal!
    page: /laborvizsgalatok
  - title: Ultrahang
    text: Az ultrahangvizsgálat fájdalommentes, gyors és pontos módszer a belső szervek, ízületek és erek állapotának vizsgálatára. Korszerű készülékeinkkel azonnali képet kaphat egészségi állapotáról, akár beutaló nélkül is. Keressen minket bizalommal időpontért!
    page: /ultrahang
aboutTitle: Rehabilitációs, Diagnosztikai és Orvosi központ
aboutText: Célunk az amatőr és profi sportolók, valamint a magánszemélyek mozgásszervi állapotának pontos diagnosztikája és célzott kezelése. Korszerű vizsgálati módszerekkel feltárjuk a mozgásszervi panaszok okait, elemezzük a terhelhetőséget és a sérüléskockázatot. A diagnosztikai eredményekre építve személyre szabott gyógytorna- és fizikoterápiás programokat állítunk össze, amelyek elősegítik a hatékony regenerációt, a fájdalomcsillapítást és a mozgásfunkciók helyreállítását. Integrált szemléletünkkel nemcsak a gyógyulást támogatjuk, hanem hozzájárulunk a megelőzéshez is.
