testimonialsTitle: Mit Mondanak Pácienseink
testimonials:
  - Nagyon elégedett vagyok a rendelő szolgáltatásaival. MR-vizsgálaton jártam itt, és már az időpont egyeztetése is gyors és zökkenőmentes volt
  - Barátságos a légkör, és tiszta modern a környezet nagyon kellemes illattal 🙂 Egyetlen időpontomnál sem volt csúszás. Szívből ajánlom
  - Egy hónap alatt 8-10 mágneses és néhány lézerterápián vettem részt, melyeknek eredményeképpen teljesen felépültem és egészséges lett újra a combom
  - Vérprofi csapata van Szekér Zolinak, le a kalappal mindenki előtt.🫡👏
  - 4 hét után már fájdalommentesen tudok létezni a mindennapokban és hamarosan újra edzés is jöhet
  - Több alkalommal jártam a Medical Pointban. Mindig gyorsak és segítőkészek voltak. Vizsgálat után hatékony kezeléseket kaptam.
  - Az MR vizsgálatot végző hölgy rendkívül kedves,mindenre kiterjedő felvilágosítást adott.Precízség,pontosság, kedvesség
  - Rendkívül gyorsak és segítőkészek voltak velem. Mindig ide fogok járni MR vizsgálatra. Mindkét alkalommal előbb készült el a leletem
